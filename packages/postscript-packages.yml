source: https://developers.postscript.io/docs/javascript-sdk-api-reference
note: >-
  Postscript ships exactly one first-party client library: a browser JavaScript SDK distributed from
  its own CDN host (sdk.postscript.io) and installed automatically by the Postscript Shopify app.
  There is no first-party package on npm, PyPI, RubyGems, Packagist, crates.io, NuGet, Maven Central
  or pkg.go.dev — an unauthenticated npm registry search for "postscript sms" (2026-08-13) returned
  only third-party work (@sunrise-integration/postscript-sms 1.0.0, published 2021-12-09, and
  n8n-nodes-postscript 1.0.0, published 2026-04-25), neither of which is published by Postscript.
packages:
- language: javascript
  registry: cdn
  name: postscript-sdk
  url: https://sdk.postscript.io/sdk.bundle.js
  install: '<script src="https://sdk.postscript.io/sdk.bundle.js"></script>'
  docs: https://developers.postscript.io/docs/javascript-sdk-api-reference
  official: true
  version: null
  published: null
  note: >-
    Browser SDK exposed as window.postscript (identify, getSubscriberId, event) plus the onsite
    opt-in popups and checkout opt-in checkbox. Distribution is a single unpinned CDN URL — there is
    no version in the path and no registry metadata endpoint to query, so a consumer cannot tell
    which build they are loading and neither can we. A direct GET of the bundle from outside a
    merchant storefront returned HTTP 403 on 2026-08-13, so no version string could be read from
    the artifact either. version/published recorded as null: checked, nothing publishable to record.
