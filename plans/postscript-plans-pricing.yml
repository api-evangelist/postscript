description: >-
  Published Postscript SMS Marketing plans, read from the provider's pricing page on 2026-08-13.
  This file replaces a 2026-05-04 scaffold whose Free/Professional/Enterprise request quotas were
  invented defaults. Postscript does not price the API by call volume at all — plans are priced by
  platform subscription plus per-message send rates, and API access for custom integrations is a
  feature gated to the Professional tier and above.
plan_count: 4
currency: USD
billing_period: month
api_access_note: >-
  The pricing page lists "API access for custom integrations" as a Professional-tier feature.
  Postscript's developer docs add that since April 2022 custom API access for individual shops is
  limited to enterprise plans, with grandfathered access for shops that had it before that date, and
  that shops on any plan can still generate API keys for use with approved Integration Partners.
  Integration Partners retain full API access regardless of the shop's plan.
  Sources: https://postscript.io/pricing and
  https://developers.postscript.io/docs/who-has-access-to-the-partner-api
