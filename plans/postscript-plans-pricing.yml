add_ons:
  - name: Postscript AI Plan
    description: Bundle covering Brand Center, Infinity Testing and Shopper AI products.
    price: contact sales
  - name: Postscript Plus
    description: Managed marketing service pairing the platform with in-house SMS strategists.
    price: contact sales
  - name: Fondue CashBack
    description: Smart coupon alternative billed on redemption.
    price: contact sales
  - name: Designated short code
    description: Dedicated short code passed through at the carrier fee.
    price: '750.00'
    period: month
    note: Charged by the carriers and passed through by Postscript without markup.
trial:
  available: true
  length_days: 30
  description: >-
    A $100 credit applied against message and carrier fees for the first 30 days. During the trial a
    shop can build two keywords, set up automations, send campaigns, create segments, use
    integrations and respond to customers. After the credit is exhausted, sends are billed at the
    Starter package rate unless another package is selected.
carrier_fees:
  sms_average_usd: '0.00418'
  mms_average_usd: '0.00841'
  note: >-
    Carrier surcharges are listed on the invoice at the exact carrier-defined amount with no markup.
    Listed platform rates cover the US 50 states and Canada only; international sending is priced
    separately.
billing_notes:
  - Incoming messages are not charged beyond carrier fees.
  - Messages that fail to deliver are not charged.
  - No contract is required; plans can be upgraded or downgraded at any time.
maintainers:
