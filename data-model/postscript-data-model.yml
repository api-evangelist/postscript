provider: Postscript
api: Postscript Partner API v2
identifier_scheme:
  style: prefixed opaque string
  documented_prefixes:
    s_: subscriber
    shop_: shop
    im_: incoming message
  undocumented:
  - Webhook subscription ids are bare UUIDs (89066f0a-eb36-4ed8-b98c-606e6dcac715) with no prefix.
  - No prefix is published for keyword, message request or sent message ids.
  note: >-
    v1 identifiers were unprefixed and derived from a shop's API keys, so rotating keys could break
    an integration. v2 prefixes decouple the id from the credential. Legacy ids are still accepted on
    v2 requests with no published sunset.
entities:
- name: Shop
  id_prefix: shop_
  description: A Shopify merchant account on Postscript. The tenant every other object hangs from.
  operations: []
  note: >-
    There is no shop endpoint. A shop is addressed implicitly by which token authenticates the call,
    or explicitly by a partner through X-Postscript-Shop-Token. GET /api/v2/me resolves the calling
    token to its identity.
- name: Subscriber
  id_prefix: s_
  description: An SMS subscriber belonging to a shop, with opt-in state, contact fields and free-form properties.
  operations: [get-subscribers, get-subscriber, update-subscriber-by-id, unsubscribe, redact]
  fields: [id, phone_number, email, shopify_customer_id, ps_id, created_at, updated_at, properties]
  filterable: [created_at, updated_at, email, phone_number, shopify_customer_id, ps_id]
- name: Keyword
  id_prefix: null
  description: An opt-in keyword a shop configures to attribute and trigger subscriptions from a given source.
  operations: [get-keywords, get-keyword]
  note: Read-only over the API. Keywords are created in the Postscript dashboard.
- name: CustomEvent
  id_prefix: null
  description: >-
    An event a partner or shop sends into Postscript for use in Flow Builder. Namespaced with the
    sender's name on display. Carries an optional caller-supplied external_id.
  operations: [create-custom-event]
  fields: [type, subscriber_id, phone, email, occurred_at, properties, external_id]
  note: Write-only. There is no endpoint to read events back.
- name: MessageRequest
  id_prefix: null
  description: An asynchronous request to send a message; accepted with 202 and resolved later into a sent message.
  operations: [create-message, get-message-request]
- name: SentMessage
  id_prefix: null
  description: A message Postscript actually delivered, readable by id.
  operations: [get-sent-message]
- name: IncomingMessage
  id_prefix: im_
  description: An inbound text from a subscriber to a shop. Surfaced only through the shop.incoming_message webhook.
  operations: []
  fields: [id, subscriber_id, shop_id, is_opt_out, shopify_customer_id, from_number, created_at, body]
- name: WebhookSubscription
  id_prefix: null
  description: A registration binding one event type to one callback URL, with optional custom headers.
  operations: [list-webhook-subscriptions, create-webhook-subscription, get-webhook-subscription,
    update-webhook-subscription, delete-webhook-subscription]
  fields: [id, callback_url, event, headers, created_at, updated_at]
relationships:
