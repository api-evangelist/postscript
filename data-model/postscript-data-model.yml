gaps:
- >-
  Postscript publishes no components.schemas anywhere — every response in the harvested fragments is
  an inline object or a bare example string. There are no reusable named schemas to build a real
  $ref graph from, so these entities were reconstructed from field names, id prefixes and the object
  identifiers guide rather than read off the spec.
- >-
  Subscriber creation (POST /api/v2/subscribers) is demonstrated with a curl example in the guides
  but has no reference page and no published OpenAPI fragment, so it is deliberately absent from the
  harvested spec and from this model.
- No id prefixes published for keywords, message requests or sent messages.
