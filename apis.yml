aid: postscript
name: Postscript
description: >-
  Postscript is an SMS and RCS marketing platform built for Shopify brands, covering list growth,
  campaign and automation delivery, conversational messaging, AI shopping assistants and TCPA
  compliance. Its developer surface is the Partner API v2 at api.postscript.io, a twenty-operation
  REST API authenticated with private API keys, through which partners and enterprise shops read and
  update SMS subscribers, read opt-in keywords, push custom events into Flow Builder, send
  promotional, transactional and conversational messages, manage webhook subscriptions for shop and
  subscriber lifecycle events, and run compliance unsubscribe and redaction operations. A browser
  JavaScript SDK carries the onsite opt-in popups, the checkout consent checkbox and browse-behaviour
  event tracking.
