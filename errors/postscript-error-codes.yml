envelope:
  content_type: application/json
  fields:
  - name: error_code
    type: integer
    description: Postscript-assigned numeric error code.
  - name: error_message
    type: string
    description: Human-readable description of the failure.
  - name: success
    type: boolean
    description: Always false on an error response.
  example: '{"error_code": 3002, "error_message": "Rate limit exceeded", "success": false}'
  note: >-
    Postscript returns a flat proprietary error object rather than RFC 9457 problem+json. There is
    no `type` URI, no `title`/`detail` split and no `instance`, so an agent cannot dereference an
    error to documentation. The numeric code space is banded (the one published example sits in the
    3xxx range) but Postscript publishes no error-code registry, so only codes that appear in the
    documentation can be catalogued here.
