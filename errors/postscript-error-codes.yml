  message: Rate limit exceeded
  http_status: 429
  cause: More than 15 requests per second were sent on the same token or partner/shop token pair.
  action: >-
    Retry on an exponential backoff schedule with jitter. No Retry-After header is returned, so the
    delay must be chosen by the client.
  source: https://developers.postscript.io/docs/rate-limits
coverage:
  codes_published: 1
  note: >-
    ONE numeric error code is documented anywhere on Postscript's developer site — 3002, in the rate
    limits guide. Every other failure is described only by HTTP status in the per-operation OpenAPI
    blocks (see errors/postscript-problem-types.yml), and those blocks carry an empty
    `{"type":"object","properties":{}}` schema with an example of `{}`. There is no error reference
    page. An integrator cannot enumerate Postscript's failure modes ahead of time, and an agent
    cannot branch on a machine-readable error identity.
