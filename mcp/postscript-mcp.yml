notes: >-
  A live Model Context Protocol endpoint is deployed on Postscript's own documentation host,
  developers.postscript.io/mcp. A GET returns 200 with "This URL can only be accessed with a MCP
  client"; a JSON-RPC initialize or tools/list returns HTTP 401 with MCP error code -32001
  ("Authorization required"). It is the documentation MCP server that the ReadMe platform provisions
  for a project — Postscript does not advertise it anywhere in its docs, llms.txt, or changelog, and
  it is therefore a documentation-retrieval surface, not an API-execution surface. There is no
  dedicated Postscript API MCP server: mcp.postscript.io/mcp returns 404 and api.postscript.io/mcp
  returns the gateway's blanket 401.
gating:
  tools_list: gated
  reason: >-
    HTTP 401 with MCP error -32001. No WWW-Authenticate header is returned and
    /.well-known/oauth-protected-resource and /.well-known/oauth-authorization-server both 404 on
    that host, so the authorization server cannot be discovered anonymously. The real tool set and
    per-tool inputSchema require authenticated introspection.
  advertised_by_provider: false
